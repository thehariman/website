<!DOCTYPE html>
<html lang="en-IN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Thiranex Control Center</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Thiranex Admin">
    <link rel="apple-touch-icon" href="msme-verified-internship-certificate-seal.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    <style>
        :root {
            --primary: #1E40AF; /* Deep Blue */
            --accent: #FDE047;  /* Bright Yellow */
            --primary-glow: rgba(30, 64, 175, 0.15);
            --bg-light: #F8FAFC;
            --card-bg: #FFFFFF;
            --border-color: rgba(30, 64, 175, 0.1);
            --text-main: #1E293B;
            --text-dim: #64748B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #EFF6FF 0%, #F8FAFC 100%);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* High-End Technical Background */
        .background-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(30, 64, 175, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 64, 175, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            mask-image: radial-gradient(circle at center, black, transparent 90%);
        }

        .glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: var(--primary-glow);
            filter: blur(150px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.3;
            animation: pulse-glow 10s infinite alternate;
        }

        @keyframes pulse-glow {
            from { transform: scale(1) translate(-10%, -10%); opacity: 0.2; }
            to { transform: scale(1.2) translate(10%, 10%); opacity: 0.4; }
        }

        .login-wrapper {
            width: 100%;
            max-width: 460px;
            padding: 20px;
            perspective: 1000px;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 32px;
            padding: 4rem 3.5rem;
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.05),
                0 25px 50px -12px rgba(30, 64, 175, 0.15);
            animation: card-entry 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes card-entry {
            from { opacity: 0; transform: translateY(40px) rotateX(-5deg); }
            to { opacity: 1; transform: translateY(0) rotateX(0); }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .logo-circle {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 10px 30px rgba(30, 64, 175, 0.15);
            position: relative;
            padding: 5px;
            border: 1px solid rgba(30, 64, 175, 0.1);
        }

        .logo-circle::after {
            content: '';
            position: absolute;
            inset: -8px;
            border: 1px solid var(--primary);
            border-radius: 50%;
            opacity: 0.2;
            animation: ring-pulse 3s infinite;
        }

        @keyframes ring-pulse {
            0% { transform: scale(0.9); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 0; }
        }

        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }

        .title {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }

        .subtitle {
            font-size: 0.875rem;
            color: var(--text-dim);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .form-section {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748B;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.6rem;
            margin-left: 4px;
        }

        .admin-field {
            width: 100%;
            background: #F1F5F9;
            border: 1px solid #E2E8F0;
            border-radius: 14px;
            padding: 1rem 1.25rem 1rem 3.2rem;
            color: var(--text-main);
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .admin-field:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(30, 64, 175, 0.1);
        }

        .input-icon {
            position: absolute;
            left: 1.25rem;
            bottom: 1rem;
            color: #475569;
            font-size: 1.25rem;
            transition: color 0.3s;
        }

        .admin-field:focus + .input-icon {
            color: var(--primary);
        }

        .login-action {
            width: 100%;
            background: linear-gradient(135deg, #FDE047 0%, #FACC15 100%);
            color: #1E293B;
            border: none;
            border-radius: 14px;
            padding: 1.1rem;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 1rem;
            box-shadow: 0 8px 20px -5px rgba(250, 204, 21, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .login-action:hover {
            background: linear-gradient(135deg, #FACC15 0%, #EAB308 100%);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -10px rgba(250, 204, 21, 0.6);
        }

        .login-action:active {
            transform: translateY(0);
        }

        .login-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .status-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #FCA5A5;
            padding: 1rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
            display: none;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .portal-footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.75rem;
            color: #475569;
            font-weight: 500;
        }

        .portal-footer a {
            color: #94A3B8;
            text-decoration: none;
            transition: color 0.3s;
            margin-top: 0.5rem;
            display: inline-block;
        }

        .portal-footer a:hover {
            color: var(--primary);
        }

        /* --- Rock-Solid Static Centered Loader --- */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background: #FFFFFF;
            z-index: 100000;
            display: grid;
            place-items: center;
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), visibility 1.2s;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        .loader-hub {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 300px;
        }

        body.loading {
            overflow: hidden !important;
            height: 100dvh !important;
        }

        body.loading > .login-wrapper,
        body.loading > .background-grid,
        body.loading > .glow {
            display: none !important;
        }

        .orbit-system {
            width: 160px;
            height: 160px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 3rem;
        }

        .orbit-ring {
            position: absolute;
            border: 1px solid rgba(30, 64, 175, 0.1);
            border-radius: 50%;
        }

        .ring-1 { width: 100%; height: 100%; border-top: 2px solid var(--primary); }
        .ring-2 { width: 130px; height: 130px; border-right: 2px solid var(--accent); }
        .ring-3 { width: 100px; height: 100px; border-bottom: 2px solid var(--primary); opacity: 0.5; }

        .loader-logo-container {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(30, 64, 175, 0.15);
            z-index: 10;
        }

        .loader-logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .progress-container {
            width: 200px;
            height: 3px;
            background: rgba(30, 64, 175, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            position: relative;
        }

        .progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), #818cf8);
            box-shadow: 0 0 10px var(--primary);
            transition: width 1s ease-out;
        }

        .loader-info {
            text-align: center;
        }

        .loader-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: 0.15em;
            margin-bottom: 0.25rem;
            background: linear-gradient(90deg, #1e3a8a, #4f46e5);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .loader-status {
            font-size: 0.75rem;
            color: #64748b;
            font-weight: 600;
            letter-spacing: 0.05em;
            opacity: 0.7;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loaded #preloader {
            opacity: 0;
            visibility: hidden;
        }

        /* Mobile specific adjustments */
        @media (max-width: 480px) {
            .login-card {
                padding: 2.5rem 1.75rem;
                border-radius: 24px;
            }
            .title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body class="loading">
    <!-- Premium Cinematic Pre-loader -->
    <div id="preloader">
        <div class="loader-hub">
            <div class="orbit-system">
                <div class="orbit-ring ring-1"></div>
                <div class="orbit-ring ring-2"></div>
                <div class="orbit-ring ring-3"></div>
                <div class="loader-logo-container">
                    <img src="msme-verified-internship-certificate-seal.png" alt="Thiranex">
                </div>
            </div>
            <div class="progress-container">
                <div id="loaderProgress" class="progress-fill"></div>
            </div>
            <div class="loader-info">
                <div class="loader-title">Thiranex Portal</div>
                <div class="loader-status" id="loaderState">Connecting to Server</div>
            </div>
        </div>
    </div>

    <div class="background-grid"></div>
    <div class="glow"></div>

    <div class="login-wrapper">
        <div class="login-card">
            <header class="brand-header">
                <div class="logo-circle">
                    <img src="msme-verified-internship-certificate-seal.png" alt="Thiranex MSME Verified Internship Program Seal">
                </div>
                <h1 class="title">Control Center</h1>
                <p class="subtitle">Administrator Authentication</p>
            </header>

            <div id="statusBox" class="status-box"></div>

            <form id="authForm" class="form-section">
                <div class="input-wrapper">
                    <label class="input-label">Admin Credentials</label>
                    <input type="email" id="email" class="admin-field" placeholder="Enter administrator email" required autocomplete="email">
                    <i class="ph-bold ph-envelope-simple input-icon"></i>
                </div>

                <div class="input-wrapper">
                    <label class="input-label">Security Key</label>
                    <input type="password" id="password" class="admin-field" placeholder="Enter access password" required autocomplete="current-password">
                    <i class="ph-bold ph-lock-key input-icon"></i>
                </div>

                <button type="submit" class="login-action" id="submitBtn">
                    <span>Unlock System</span>
                    <i class="ph-bold ph-arrow-right"></i>
                </button>
            </form>

            <footer class="portal-footer">
                <p style="margin-bottom: 1rem; color: #334155; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                    <i class="ph ph-monitor"></i> Optimized for Desktop Infrastructure
                </p>
                <p>&copy; 2026 Thiranex Tech Systems. Authorized Access Only.</p>
                <a href="student-login.html" style="font-size: 0.65rem; opacity: 0.7; margin-top: 1rem; display: block; text-decoration: underline;">Login as Student</a>
            </footer>
        </div>
    </div>

    <script src="db.js"></script>
    <script>
        const form = document.getElementById('authForm');
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('statusBox');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Reset UI
            status.style.display = 'none';
            btn.disabled = true;
            const originalBtn = btn.innerHTML;
            btn.innerHTML = '<i class="ph-bold ph-spinner-gap loading-icon"></i> Authenticating...';

            try {
                // Ensure data is loaded
                await DB.initialize();

                const auth = DB.login(email, password);

                if (auth && auth.role === 'admin') {
                    // Success Redirect
                    window.location.href = 'admin.html';
                } else {
                    // Auth Failure
                    let msg = 'Validation failed. Access denied.';
                    if (!auth && !isAdmin) msg = 'Student record not found or data not synchronized.';
                    
                    status.innerText = msg;
                    status.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = originalBtn;
                }

            } catch (err) {
                console.error("Auth System Error:", err);
                status.innerText = 'Infrastructure connectivity error. Check your connection.';
                status.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = originalBtn;
            }
        });

        // PWA Installation - Thiranex Control Center
        let deferredPrompt;
        const installBtn = document.createElement('div');
        installBtn.id = 'pwaInstallBtn';
        installBtn.style.cssText = 'position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--primary); color:white; padding:12px 24px; border-radius:50px; font-weight:700; box-shadow:0 10px 25px rgba(30,64,175,0.4); z-index:9999; cursor:pointer; display:none; align-items:center; gap:10px; animation: slideUpPWA 0.5s ease; letter-spacing: 0.02em;';
        installBtn.innerHTML = '<i class="ph-bold ph-lightning"></i> Install Control Center';
        document.body.appendChild(installBtn);

        const pStyle = document.createElement('style');
        pStyle.textContent = '@keyframes slideUpPWA { from { transform:translateX(-50%) translateY(100px); opacity:0; } to { transform:translateX(-50%) translateY(0); opacity:1; } }';
        document.head.appendChild(pStyle);

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'flex';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') { installBtn.style.display = 'none'; }
                deferredPrompt = null;
            }
        });

        if (('serviceWorker' in navigator)) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }

        // Extended 5-second cinematic loading sequence
        window.addEventListener('load', () => {
            const pb = document.getElementById('loaderProgress');
            const state = document.getElementById('loaderState');
            
            // Step 1: Initial (1s)
            setTimeout(() => { pb.style.width = '20%'; state.innerText = 'Initializing Interface'; }, 500);
            
            // Step 2: Data (2s)
            setTimeout(() => { pb.style.width = '50%'; state.innerText = 'Synchronizing Secure Data'; }, 1500);

            // Step 3: Security (3s)
            setTimeout(() => { pb.style.width = '75%'; state.innerText = 'Security Verification'; }, 2500);

            // Step 4: Finalizing (4s)
            setTimeout(() => { pb.style.width = '90%'; state.innerText = 'Finalizing Control Hub'; }, 3500);

            // Step 5: Verified (5s)
            setTimeout(() => { pb.style.width = '100%'; state.innerText = 'Identity Verified'; }, 4500);

            // Exit (End of 5s)
            setTimeout(() => {
                document.body.classList.remove('loading');
                document.body.classList.add('loaded');
            }, 5500);
        });
    </script>
</body>

</html>
